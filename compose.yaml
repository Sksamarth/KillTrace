name: killchain-ai
services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      KILLCHAIN_DATA_DIR: /data
      KILLCHAIN_DUCKDB_MEMORY_LIMIT: ${KILLCHAIN_DUCKDB_MEMORY_LIMIT:-1GB}
      KILLCHAIN_DUCKDB_THREADS: ${KILLCHAIN_DUCKDB_THREADS:-2}
      KILLCHAIN_DUCKDB_MAX_TEMP_SIZE: ${KILLCHAIN_DUCKDB_MAX_TEMP_SIZE:-10GB}
      KILLCHAIN_INGESTION_INPUT_DIR: /inputs
      KILLCHAIN_INGESTION_BATCH_ROWS: ${KILLCHAIN_INGESTION_BATCH_ROWS:-4096}
      KILLCHAIN_INGESTION_BATCH_BYTES: ${KILLCHAIN_INGESTION_BATCH_BYTES:-8388608}
      KILLCHAIN_INGESTION_MEMORY_MB: ${KILLCHAIN_INGESTION_MEMORY_MB:-768}
      KILLCHAIN_INGESTION_TEMP_BYTES: ${KILLCHAIN_INGESTION_TEMP_BYTES:-67108864}
      KILLCHAIN_INGESTION_ROW_GROUP_ROWS: ${KILLCHAIN_INGESTION_ROW_GROUP_ROWS:-1024}
      KILLCHAIN_INGESTION_DISK_RESERVE_BYTES: ${KILLCHAIN_INGESTION_DISK_RESERVE_BYTES:-268435456}
    volumes: ["analysis-data:/data", "./data:/inputs:ro"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
volumes:
  analysis-data:
